<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#18233F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3D9"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#917018"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>
  
  <!-- VR Headset Silhouette -->
  <g transform="translate(106, 120)">
    <!-- Headband strap -->
    <path d="M 0,110 C 20,40 100,0 150,0 C 200,0 280,40 300,110" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
    <!-- Visor -->
    <rect x="25" y="60" width="250" height="130" rx="45" fill="#0A0F1D" stroke="url(#gold)" stroke-width="8"/>
    <!-- Glowing Visor Glass -->
    <rect x="45" y="80" width="210" height="90" rx="30" fill="#121A2F" stroke="#DFBD53" stroke-width="3"/>
    <!-- VR Text on Glass -->
    <text x="150" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">VR</text>
  </g>

  <!-- Typography -->
  <text x="256" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="6">STREET</text>
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">KARAMA</text>
</svg>

